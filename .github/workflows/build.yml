name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # The supported build: MSVC on Windows.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Show artifacts
        run: Get-ChildItem build\Release -Filter *.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: audio-monitor-win64
          path: build/Release/*.exe

  # Portability check plus the host-native DSP tests. These are the only tests
  # that can run without real audio hardware, so they gate every push.
  linux-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake
      - name: Host-native DSP and config tests
        run: ./scripts/run_tests.sh
      - name: Cross-compile for Windows
        run: ./scripts/crossbuild.sh ON
