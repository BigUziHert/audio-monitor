name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # The supported build: MSVC on Windows.
  msvc:
    # Match the VS 2022 generator below; windows-latest now carries VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Run CTest suite except app capture
        run: ctest --test-dir build -C Release --output-on-failure -E app-capture
      - name: Show artifacts
        run: Get-ChildItem build\Release -Filter *.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: audio-monitor-win64
          path: build/Release/*.exe

  # Host-native platform-independent tests plus a Windows cross-compile check.
  linux-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake
      - name: Host-native platform-independent tests
        run: ./scripts/run_tests.sh
      - name: Cross-compile for Windows
        run: ./scripts/crossbuild.sh ON
